name = "thegarden"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Run to create: wrangler d1 create thegarden-db
# Then replace the database_id below with the output.
[[d1_databases]]
binding = "DB"
database_name = "thegarden-db"
database_id = "YOUR_D1_DATABASE_ID"

# Run to create: wrangler kv namespace create SETTINGS
# Then replace id and preview_id below.
[[kv_namespaces]]
binding = "SETTINGS"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_NAMESPACE_PREVIEW_ID"
